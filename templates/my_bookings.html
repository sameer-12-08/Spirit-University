<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Bookings</title>
<style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f4f6f8;color:#142d4f}nav{background:#142d4f;color:#fff;padding:17px 5%;display:flex;justify-content:space-between;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;margin-left:14px}.wrap{width:90%;max-width:1000px;margin:30px auto}.item{background:#fff;padding:20px;border-radius:15px;margin:14px 0;box-shadow:0 5px 20px #0001}.cancel{display:inline-block;background:#b42318;color:#fff;padding:9px 13px;border-radius:7px;text-decoration:none}</style></head>
<body><nav><b>Spirit University</b><div><a href="{{url_for('dashboard')}}">Dashboard</a><a href="{{url_for('classrooms')}}">Classrooms</a><a href="{{url_for('logout')}}">Logout</a></div></nav><div class="wrap"><h1>My Bookings</h1>{% for b in bookings %}<div class="item"><h2>{{b.classroom}}</h2><p>{{b.building}}</p><p>📅 {{b.date}} · ⏰ {{b.time}}</p><p>👥 {{b.seats}} seats · {{b.purpose}}</p><a class="cancel" href="{{url_for('cancel_booking',booking_id=b.id)}}" onclick="return confirm('Cancel this booking?')">Cancel</a></div>{% else %}<div class="item"><p>No bookings yet.</p></div>{% endfor %}</div></body></html>
