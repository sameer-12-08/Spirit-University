<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Classroom</title>
<style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f4f6f8;color:#142d4f}nav{background:#142d4f;color:#fff;padding:17px 5%;display:flex;justify-content:space-between;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;margin-left:14px}.wrap{width:90%;max-width:800px;margin:30px auto}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 25px #0001}.card img{width:100%;height:270px;object-fit:cover}.inside{padding:25px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px}.field textarea{min-height:90px}.btn{width:100%;padding:14px;background:#142d4f;color:#fff;border:0;border-radius:9px;font-weight:700;font-size:15px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head>
<body><nav><b>Spirit University</b><div><a href="{{url_for('dashboard')}}">Dashboard</a><a href="{{url_for('my_bookings')}}">My Bookings</a><a href="{{url_for('logout')}}">Logout</a></div></nav>
<div class="wrap"><div class="card"><img src="{{url_for('static',filename='images/'+classroom.image)}}"><div class="inside"><h1>{{classroom.name}}</h1><p>{{classroom.building}} · Capacity {{classroom.capacity}}</p><p>{{classroom.equipment}}</p>
<form method="POST"><input type="hidden" id="time_slot" name="time_slot">
<div class="field"><label>Date</label><input type="date" name="booking_date" required></div>
<div class="row"><div class="field"><label>Start Time</label><input type="time" id="start" required step="60"></div><div class="field"><label>End Time</label><input type="time" id="end" required step="60"></div></div>
<div class="field"><label>Seats (maximum 5)</label><input type="number" name="seats" min="1" max="5" value="1" required></div>
<div class="field"><label>Purpose</label><textarea name="purpose" placeholder="Project discussion, group study, seminar..." required></textarea></div>
<button class="btn" type="submit">Confirm Booking</button></form></div></div></div>
<script>
function fmt(v){let [h,m]=v.split(':').map(Number);let ap=h>=12?'PM':'AM';h=h%12||12;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+' '+ap}
document.querySelector('form').addEventListener('submit',function(e){let s=document.getElementById('start').value,e1=document.getElementById('end').value;if(!s||!e1)return;if(e1<=s){e.preventDefault();alert('End time must be later than start time.');return}document.getElementById('time_slot').value=fmt(s)+' - '+fmt(e1)})
</script></body></html>
